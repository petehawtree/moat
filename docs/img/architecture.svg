<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1220" role="img" aria-label="Diagram: three free data sources feed an ingestion stage that writes into one shared SQLite store; five planned pipeline stages read and write that same store in sequence, ending in a citation-checked AI analysis step; the result reaches a human who makes the final call, while a separate watchlist monitor loops back to re-trigger ingestion on its own.">
  <style>
    .node-title { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em; fill: #1b2420; }
    .node-title-inv { fill: #f5f3e8; }
    .node-title-gold { fill: #211a08; }
    .node-sub { font-family: ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; font-weight: 400; fill: #6b6f62; }
    .node-sub-inv { fill: #f5f3e8; opacity: 0.88; }
    .node-sub-gold { fill: #211a08; opacity: 0.85; }
    .tag { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 500; letter-spacing: 0.06em; fill: #6b6f62; }
    .flow-label { font-family: ui-monospace, Menlo, Consolas, monospace; fill: #6b6f62; }
    .callout-text { font-family: ui-monospace, Menlo, Consolas, monospace; fill: #1b2420; }

    .box-done { fill: #2f5233; stroke: #2f5233; stroke-width: 1.5; }
    .box-planned { fill: #eeefe7; stroke: #6b6f62; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .box-human { fill: #b08d2b; stroke: #b08d2b; stroke-width: 1.5; }
    .box-source { fill: #e4e1d3; stroke: #c9c4b4; stroke-width: 1.5; }
    .box-db { fill: #f7f6ef; stroke: #1b2420; stroke-width: 1.5; }
    .box-callout { fill: #f7f6ef; stroke: #6b6f62; stroke-width: 1.25; stroke-dasharray: 3 3; }

    .flow-line { stroke: #1b2420; stroke-width: 1.6; fill: none; }
    .spine-line { stroke: #c9c4b4; stroke-width: 1.4; stroke-dasharray: 2 4; fill: none; }
    .spine-tick { stroke: #c9c4b4; stroke-width: 1.4; fill: none; }
    .loop-line { stroke: #8a6d19; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; }
  </style>

    <rect x="0" y="0" width="800" height="1220" fill="#eeefe7"></rect>
  <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#1b2420"></path>
        </marker>
        <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#8a6d19"></path>
        </marker>
      </defs>

      <!-- ================= SOURCES ================= -->
      <rect x="20" y="24" width="190" height="80" rx="3" class="box-source"></rect>
      <text x="115" y="52" text-anchor="middle" class="node-title" font-size="12">US FUNDAMENTALS</text>
      <text x="115" y="72" text-anchor="middle" class="node-sub" font-size="10">source: SEC EDGAR</text>
      <text x="115" y="88" text-anchor="middle" class="node-sub" font-size="10">10-K/10-Q, throttled</text>

      <rect x="225" y="24" width="190" height="80" rx="3" class="box-source"></rect>
      <text x="320" y="54" text-anchor="middle" class="node-title" font-size="13.5">UNIVERSE</text>
      <text x="320" y="74" text-anchor="middle" class="node-sub" font-size="10">source: S&amp;P 500,</text>
      <text x="320" y="88" text-anchor="middle" class="node-sub" font-size="10">NASDAQ-100</text>

      <rect x="430" y="24" width="190" height="80" rx="3" class="box-source"></rect>
      <text x="525" y="54" text-anchor="middle" class="node-title" font-size="13.5">PRICES</text>
      <text x="525" y="74" text-anchor="middle" class="node-sub" font-size="10">source: yfinance</text>
      <text x="525" y="88" text-anchor="middle" class="node-sub" font-size="10">daily, incremental</text>

      <!-- convergence into INGEST -->
      <line x1="115" y1="104" x2="335" y2="146" class="flow-line"></line>
      <line x1="320" y1="104" x2="338" y2="146" class="flow-line"></line>
      <line x1="525" y1="104" x2="345" y2="146" class="flow-line" marker-end="url(#arrow)"></line>
      <text x="400" y="128" text-anchor="middle" class="flow-label" font-size="10">fetch &amp; normalize</text>

      <!-- ================= INGEST ================= -->
      <rect x="60" y="148" width="560" height="80" rx="3" class="box-done"></rect>
      <text x="340" y="182" text-anchor="middle" class="node-title node-title-inv" font-size="16">INGEST</text>
      <text x="340" y="204" text-anchor="middle" class="node-sub node-sub-inv" font-size="11">518 companies · fallback CIK lookup for SEC file gaps</text>

      <line x1="340" y1="228" x2="340" y2="262" class="flow-line" marker-end="url(#arrow)"></line>

      <!-- ================= DB CYLINDER ================= -->
      <path d="M190,276 A150,14 0 0 1 490,276 L490,328 A150,14 0 0 1 190,328 Z" class="box-db"></path>
      <ellipse cx="340" cy="276" rx="150" ry="14" fill="#f7f6ef" stroke="#1b2420" stroke-width="1.5"></ellipse>
      <text x="340" y="308" text-anchor="middle" class="node-title" font-size="14">moat.db</text>
      <text x="340" y="322" text-anchor="middle" class="node-sub" font-size="9.5" opacity="0.8">SQLite · per company × stage × run</text>

      <!-- spine (persistent store every stage touches) -->
      <line x1="690" y1="188" x2="690" y2="906" class="spine-line"></line>
      <circle cx="690" cy="188" r="2.5" fill="#6b6f62"></circle>
      <circle cx="690" cy="416" r="2.5" fill="#6b6f62"></circle>
      <circle cx="690" cy="526" r="2.5" fill="#6b6f62"></circle>
      <circle cx="690" cy="636" r="2.5" fill="#6b6f62"></circle>
      <circle cx="690" cy="796" r="2.5" fill="#6b6f62"></circle>
      <circle cx="690" cy="906" r="2.5" fill="#6b6f62"></circle>
      <line x1="620" y1="188" x2="690" y2="188" class="spine-tick"></line>
      <line x1="620" y1="416" x2="690" y2="416" class="spine-tick"></line>
      <line x1="620" y1="526" x2="690" y2="526" class="spine-tick"></line>
      <line x1="620" y1="636" x2="690" y2="636" class="spine-tick"></line>
      <line x1="620" y1="796" x2="690" y2="796" class="spine-tick"></line>
      <line x1="620" y1="906" x2="690" y2="906" class="spine-tick"></line>
      <text x="698" y="192" class="flow-label" font-size="9.5">reads + writes</text>

      <line x1="340" y1="342" x2="340" y2="374" class="flow-line" marker-end="url(#arrow)"></line>

      <!-- ================= STAGE 1: SCREEN ================= -->
      <rect x="60" y="376" width="560" height="80" rx="3" class="box-planned"></rect>
      <text x="590" y="392" text-anchor="end" class="tag" font-size="9">SPRINT 2</text>
      <text x="340" y="410" text-anchor="middle" class="node-title" font-size="15">SCREEN</text>
      <text x="340" y="432" text-anchor="middle" class="node-sub" font-size="11">sector-relative thresholds, not one flat bar for every company</text>

      <line x1="340" y1="456" x2="340" y2="484" class="flow-line" marker-end="url(#arrow)"></line>

      <!-- ================= STAGE 2: QUALITY ================= -->
      <rect x="60" y="486" width="560" height="80" rx="3" class="box-planned"></rect>
      <text x="590" y="502" text-anchor="end" class="tag" font-size="9">SPRINT 2</text>
      <text x="340" y="520" text-anchor="middle" class="node-title" font-size="15">QUALITY SCORE</text>
      <text x="340" y="542" text-anchor="middle" class="node-sub" font-size="11">deterministic pre-filter, computed before any AI runs</text>

      <line x1="340" y1="566" x2="340" y2="594" class="flow-line" marker-end="url(#arrow)"></line>

      <!-- ================= STAGE 3: AI ANALYSIS ================= -->
      <rect x="60" y="596" width="560" height="80" rx="3" class="box-planned"></rect>
      <text x="590" y="612" text-anchor="end" class="tag" font-size="9">SPRINT 3</text>
      <text x="340" y="630" text-anchor="middle" class="node-title" font-size="15">AI ANALYSIS</text>
      <text x="340" y="652" text-anchor="middle" class="node-sub" font-size="11">business quality · moat · management · risk</text>

      <line x1="340" y1="676" x2="340" y2="688" class="flow-line"></line>
      <rect x="170" y="688" width="340" height="38" rx="3" class="box-callout"></rect>
      <text x="340" y="712" text-anchor="middle" class="callout-text" font-size="10.5">a claim without a citation isn't stored</text>
      <line x1="340" y1="726" x2="340" y2="754" class="flow-line" marker-end="url(#arrow)"></line>

      <!-- ================= STAGE 4: VALUATION ================= -->
      <rect x="60" y="756" width="560" height="80" rx="3" class="box-planned"></rect>
      <text x="590" y="772" text-anchor="end" class="tag" font-size="9">SPRINT 4</text>
      <text x="340" y="790" text-anchor="middle" class="node-title" font-size="15">VALUATION</text>
      <text x="340" y="812" text-anchor="middle" class="node-sub" font-size="11">Owner Earnings DCF · bear / base / bull scenarios</text>

      <line x1="340" y1="836" x2="340" y2="864" class="flow-line" marker-end="url(#arrow)"></line>

      <!-- ================= STAGE 5: COMMITTEE ================= -->
      <rect x="60" y="866" width="560" height="80" rx="3" class="box-planned"></rect>
      <text x="590" y="882" text-anchor="end" class="tag" font-size="9">SPRINT 5</text>
      <text x="340" y="900" text-anchor="middle" class="node-title" font-size="15">INVESTMENT COMMITTEE</text>
      <text x="340" y="922" text-anchor="middle" class="node-sub" font-size="11">3 AI personas debate it → one weighted score</text>

      <line x1="340" y1="946" x2="340" y2="978" class="flow-line" marker-end="url(#arrow)"></line>

      <!-- ================= DASHBOARD ================= -->
      <rect x="60" y="980" width="560" height="80" rx="3" class="box-planned"></rect>
      <text x="340" y="1014" text-anchor="middle" class="node-title" font-size="15">RANKED DASHBOARD + BRIEF</text>
      <text x="340" y="1036" text-anchor="middle" class="node-sub" font-size="11">coverage view live today · ranking ships sprint 2–5</text>

      <!-- branch to HUMAN and WATCHLIST -->
      <line x1="260" y1="1060" x2="200" y2="1102" class="flow-line" marker-end="url(#arrow)"></line>
      <line x1="420" y1="1060" x2="480" y2="1102" class="flow-line" marker-end="url(#arrow)"></line>
      <text x="180" y="1082" text-anchor="middle" class="flow-label" font-size="9.5">brief</text>
      <text x="500" y="1082" text-anchor="middle" class="flow-label" font-size="9.5">diffs vs prior run</text>

      <!-- ================= HUMAN ================= -->
      <rect x="60" y="1104" width="270" height="80" rx="3" class="box-human"></rect>
      <text x="195" y="1136" text-anchor="middle" class="node-title node-title-gold" font-size="19">YOU</text>
      <text x="195" y="1156" text-anchor="middle" class="node-sub node-sub-gold" font-size="10">Investigate · Watch · Reject</text>
      <text x="195" y="1170" text-anchor="middle" class="node-sub node-sub-gold" font-size="10">— the call is always yours</text>

      <!-- ================= WATCHLIST ================= -->
      <rect x="350" y="1104" width="270" height="80" rx="3" class="box-planned"></rect>
      <text x="600" y="1120" text-anchor="end" class="tag" font-size="9">SPRINT 6</text>
      <text x="485" y="1140" text-anchor="middle" class="node-title" font-size="14">WATCHLIST</text>
      <text x="485" y="1160" text-anchor="middle" class="node-sub" font-size="10">re-run triggers: earnings,</text>
      <text x="485" y="1174" text-anchor="middle" class="node-sub" font-size="10">price threshold, mgmt change</text>

      <!-- feedback loop -->
      <path d="M600,1104 C 760,900 760,350 622,190" class="loop-line" marker-end="url(#arrow-loop)"></path>
      <text x="726" y="650" text-anchor="middle" class="flow-label" font-size="10" fill="#8a6d19" transform="rotate(-90 726 650)">re-run trigger</text>

    </svg>
